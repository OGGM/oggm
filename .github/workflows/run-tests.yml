name: Test

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  # Check if only changelog has been modified
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - name: List changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate -q '.[].filename') || files=""
          else
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" -q '.files[].filename') || files=""
          fi
          if [ "$files" = "docs/whats-new.rst" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    name: ${{ matrix.test-env }} on ${{ matrix.container }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        test-env:
          - prepro
          - numerics
          - models_mb
          - models_dynamics
          - benchmark
          - utils
          - workflow-single
          - workflow-multi
          - graphics-mpl
        container:
          - ghcr.io/oggm/untested_base:20260223
          - ghcr.io/oggm/untested_base:py3.12
          - ghcr.io/oggm/untested_base:py3.14
        include:
          - container: python:3.14-slim
            test-env: minimal
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    continue-on-error: ${{ contains(matrix.container, 'py3') }}
    steps:
      - name: Install tools
        if: ${{ contains(matrix.container, 'slim') }}
        run: apt-get -y update && apt-get -y install git curl
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fix Git-Permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Test
        # this job passes automatically if only the changelog was modified
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        timeout-minutes: 60
        run: ./ci/run_tests.sh "${{ matrix.test-env }}" "${{ matrix.container }}"
        env:
          STATIC_MAP_API_KEY: ${{ secrets.STATIC_MAP_API_KEY }}
      - name: Normalize Artifact Name
        id: sanitize-name
        if: failure()
        shell: bash
        run: |
          SANITIZED_NAME="pytest-mpl-results-${{ matrix.test-env }}-${{ matrix.container }}"
          SANITIZED_NAME="${SANITIZED_NAME//:/_}"
          SANITIZED_NAME="${SANITIZED_NAME//\//_}"
          SANITIZED_NAME="${SANITIZED_NAME//./_}"
          echo "sanitized_name=${SANITIZED_NAME}" >> $GITHUB_OUTPUT
      - name: Upload pytest-mpl artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.sanitize-name.outputs.sanitized_name }}"
          path: /tmp/oggm-mpl-results/
      - name: Upload Coverage
        if: ${{ needs.changes.outputs.docs_only != 'true' && !contains(matrix.container, 'py3') }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COVERALLS_SERVICE_NAME: github
          COVERALLS_PARALLEL: true
        run: coveralls
  finish-coveralls:
    name: Coveralls Finished
    needs: [changes, test]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    container: python:3.12-slim
    continue-on-error: true
    steps:
    - name: Coveralls Finished
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COVERALLS_SERVICE_NAME: github
      run: |
        pip3 install --upgrade coveralls &&
        coveralls --finish
