name: Test

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  # Check if only files in docs/ have been modified
  changes:
    name: Detect docs modification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - name: List changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ -n "$PR" ]; then
            commit="repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA"
            # empty for merge commits
            parent=$(gh api "$commit" -q 'select((.parents | length) == 1) | .parents[0].sha') || parent=""
            # use paginate because GH API pages files after 300 commits
            files=$(gh api --paginate "$commit" -q '.files[] | .filename, (.previous_filename // empty)') || files=""
            # workflow file path is hardcoded, change if workflow file is moved or renamed
            if [ -n "$parent" ] && [ -n "$files" ] && ! grep -qv '^docs/' <<< "$files"; then
              runs="repos/$GITHUB_REPOSITORY/actions/workflows/run-tests.yml/runs?head_sha=$parent&per_page=1"
              status=$(gh api "$runs" -q '.workflow_runs[0].conclusion') || status=""
              if [ "$status" = "success" ]; then
                docs_only=true
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  test:
    name: ${{ matrix.test-env }} on ${{ matrix.container }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        test-env:
          - prepro
          - numerics
          - models_mb
          - models_dynamics
          - benchmark
          - utils
          - workflow-single
          - workflow-multi
          - graphics-mpl
        container:
          - ghcr.io/oggm/untested_base:20260223
          - ghcr.io/oggm/untested_base:py3.12
          - ghcr.io/oggm/untested_base:py3.14
        include:
          - container: python:3.14-slim
            test-env: minimal
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    continue-on-error: ${{ contains(matrix.container, 'py3') }}
    steps:
      - name: Install tools
        if: ${{ contains(matrix.container, 'slim') }}
        run: apt-get -y update && apt-get -y install git curl
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fix Git-Permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Test
        # this job passes automatically if only files under docs/ were modified
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        timeout-minutes: 60
        run: ./ci/run_tests.sh "${{ matrix.test-env }}" "${{ matrix.container }}"
        env:
          STATIC_MAP_API_KEY: ${{ secrets.STATIC_MAP_API_KEY }}
      - name: Normalize Artifact Name
        id: sanitize-name
        if: failure()
        shell: bash
        run: |
          SANITIZED_NAME="pytest-mpl-results-${{ matrix.test-env }}-${{ matrix.container }}"
          SANITIZED_NAME="${SANITIZED_NAME//:/_}"
          SANITIZED_NAME="${SANITIZED_NAME//\//_}"
          SANITIZED_NAME="${SANITIZED_NAME//./_}"
          echo "sanitized_name=${SANITIZED_NAME}" >> $GITHUB_OUTPUT
      - name: Upload pytest-mpl artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.sanitize-name.outputs.sanitized_name }}"
          path: /tmp/oggm-mpl-results/
      - name: Upload Coverage
        if: ${{ needs.changes.outputs.docs_only != 'true' && !contains(matrix.container, 'py3') }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COVERALLS_SERVICE_NAME: github
          COVERALLS_PARALLEL: true
        run: coveralls
  finish-coveralls:
    name: Coveralls Finished
    needs: [changes, test]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    container: python:3.12-slim
    continue-on-error: true
    steps:
    - name: Coveralls Finished
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COVERALLS_SERVICE_NAME: github
      run: |
        pip3 install --upgrade coveralls &&
        coveralls --finish
